<text class="t-directive" x="1480" y="24" text-anchor="start" font-size="14"><tspan x="1480" dy="0">.meas tran IBONE AVG -I(R_BONE) FROM 12m TO 15m</tspan><tspan x="1480" dy="16">.meas tran VBONE AVG V(BONE_P,BONE_N) FROM 12m TO 15m</tspan><tspan x="1480" dy="16">.meas tran IERR PARAM 100*abs(IBONE-IREF)/IREF</tspan><tspan x="1480" dy="16">.meas tran PASS PARAM if(IERR&lt;=1,1,0)</tspan></text>
<text class="t-directive" x="1480" y="-88" text-anchor="start" font-size="14"><tspan x="1480" dy="0">.tran 15m startup</tspan></text>
<text class="t-directive" x="1480" y="-32" text-anchor="start" font-size="14"><tspan x="1480" dy="0">.param R5SET=10k*(3.3/(IREF*3k)-1)</tspan></text>
<text class="t-directive" x="1480" y="-288" text-anchor="start" font-size="14"><tspan x="1480" dy="0">.step param IREF list 10u 20u 50u 100u 200u</tspan></text>
